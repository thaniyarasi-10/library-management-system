<!DOCTYPE html>
<html>
<head>
    <title>Overdue Books Notification</title>
</head>
<body>
    <h2>Library Management System</h2>
    <p>Dear {{USER_NAME}},</p>
    <p>You have overdue books. A fine of ₹5 per book per day is applied.</p>
    <table border="1">
        <thead>
            <tr>
                <th>Book Title</th>
                <th>Author</th>
                <th>Due Date</th>
                <th>Days Overdue</th>
                <th>Fine (₹)</th>
            </tr>
        </thead>
        <tbody>
            {{BOOK_ROWS}}
        </tbody>
    </table>
    <p><strong>Total Overdue Fine: {{TOTAL_FINE}}</strong></p>
    <p>Please return the books as soon as possible.</p>
</body>
</html>
